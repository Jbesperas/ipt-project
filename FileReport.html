<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FILE A REPORT</title>
    <link rel="stylesheet" href="FileReport.css">

    </head>  
    <body>
    <div class="lost-found-container">
      <!--Header -->  
      <header class="header">
        <div class="logo-section">
          <img src="/UDMLOGO.png" alt="UDM Logo" class="logo" />
          <span class="title">Universidad De Manila<br></br><p>Former City College of Manila</p></span>
          <h1>Lost and Found</h1>
          
        </div>
        <nav>
          <a href="About.html" class="nav-link">About</a>
        </nav>
      </header>
      <!--Main Component-->
      <!--Categories-->
        <div class = "item-container">
         <h1>Report Lost Item</h1>
         <div class = "forms">
             <form class="form-groups" id="reportForm">
               <label for="category">Item Category</label><br>
               <select name="category" id="category" required>
                 <option value="" disabled selected hidden>Select Categories</option>
                 <option value="electronics">Electronics</option>
                 <option value="clothing">Clothing</option>
                 <option value="id & cards">ID & Cards</option>
                 <option value="bags">Bags</option>
                 <option value="books">Books</option>
                 <option value="accessories">Accessories</option>
                 <option value="miscellaneous">Miscellaneous</option>
               </select><br><br>

               <label for="description-item">Descriptions</label>
               <input type="text" id="description" placeholder="Describe..." required><br>

               <div class="Date">
                  <label for="date">Date</label>
                     <input type="date" id="date" required>
               </div><br>

               <div class="LaL">
                    <label for="location">Location and Last Seen</label>
                      <input type="text" id="location" placeholder="Enter the details..." required>
              </div><br>

                <div class="radios">
                  <label class="radio-button">
                     <input type="radio" name="status" value="missing" required>
                      <span>Missing</span>
                 </label>
              <label class="radio-button">
                  <input type="radio" name="status" value="found">
                  <span>Found</span>
              </label>
               </div><br>

               <label>Owner's Information</label>
             <div class="owners-name">
                 <input type="text" id="ownerName" placeholder="Name..." required>
                 <input type="tel" id="ownerNumber" placeholder="Contact Number..." required>
             </div><br>

             <div class="Nav-Buttons"> 
                 <button type="button" class="nav-btn"><a href="index.html">Back</a></button> 
                 <button type="submit" class="nav-btn">Submit</button> 
             </div>
            </form>



         </div>
        </div>
        
        <script>
  document.getElementById("reportForm").addEventListener("submit", function (e) {
    e.preventDefault(); // prevent actual form submission

    const report = {
      category: document.getElementById("category").value,
      description: document.getElementById("description").value,
      date: document.getElementById("date").value,
      location: document.getElementById("location").value,
      status: document.querySelector('input[name="status"]:checked')?.value || "",
      ownerName: document.getElementById("ownerName").value,
      ownerNumber: document.getElementById("ownerNumber").value
    };

    // Get existing records or create new array
    const records = JSON.parse(localStorage.getItem("lostFoundRecords")) || [];

    // Add new record
    records.push(report);

    // Save back to localStorage
    localStorage.setItem("lostFoundRecords", JSON.stringify(records));

    // Redirect to recent records page
    window.location.href = "RecentRecords.html";
  });
</script>


      </body>

</html>
